name: Build Desktop Release
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: runtimes-python31314-dotnet8028
      - name: Install dependencies
        run: |
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pytest
      - name: Prepare verified engine and runtimes
        run: npm --prefix desktop run prepare:runtime
      - name: Verify migration and core regression
        run: |
          npm --prefix desktop run test:migration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests -q
      - name: Check desktop contracts
        run: |
          npm --prefix desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-auto-lock.mjs
      - name: Build desktop and packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix desktop run dist
      - name: Verify independent localization entry
        run: node desktop/scripts/verify-localize-entry.mjs
      - name: Verify automatic and fixed league selection
        run: node desktop/scripts/verify-leagues.mjs
      - name: Verify packaged application
        run: |
          node desktop/scripts/verify-package.mjs --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-startup.mjs --packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-update-recovery.mjs --packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-no-install.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/verify-compatibility.mjs
      - name: Check version tag and generate hashes
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/package version mismatch' }
          Get-Item "desktop/dist/POE-Price-Patch-$version-x64-Setup.exe", "desktop/dist/POE-Price-Patch-$version-x64-NoInstall.zip" | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content desktop/dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: poe-price-patch-desktop
          path: |
            desktop/dist/*-Setup.exe
            desktop/dist/*-NoInstall.zip
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: poe-price-patch-desktop
          path: release
      - name: Publish versioned desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
            gh release edit "$RELEASE_TAG" --title "POE 物价补丁 $RELEASE_TAG" --notes-file docs/release-notes.md --latest
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(endswith("-Portable.exe") or endswith("-x64-.zip"))' | while IFS= read -r asset; do
              [ -z "$asset" ] || gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "POE 物价补丁 $RELEASE_TAG" --notes-file docs/release-notes.md --latest
          fi
          archive_url=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name | endswith("-NoInstall.zip")) | .apiUrl')
          gh api --method PATCH "$archive_url" -f label="免安装版 ZIP（完整解压后运行物价补丁.exe）"
